<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product catalog</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font: 1rem/1.5 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
    main { max-width: 64rem; margin: 0 auto; padding: clamp(1rem, 5vw, 4rem); }
    header { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; padding: clamp(1.25rem, 4vw, 2.5rem); border-radius: 16px; background: var(--cp-accent); color: var(--cp-accent-fg); }
    header p { margin: 0; color: inherit; }
    header h1 + p { margin-top: .75rem; }
    header .eyebrow { margin-bottom: .75rem; color: inherit; text-transform: uppercase; letter-spacing: .1em; }
    header .primary { color: var(--cp-accent); background: var(--cp-surface); border-color: var(--cp-surface); }
    header .primary:hover:not(:disabled) { color: var(--cp-accent-hover); background: var(--cp-bg-elevated); }
    header button:focus-visible { outline-color: var(--cp-accent-fg); }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.75rem); line-height: 1.1; }
    h2 { margin: 0; font-size: 1.25rem; }
    p { color: var(--cp-text-muted); }
    .eyebrow { margin: 0 0 .5rem; color: var(--cp-accent); font-size: .875rem; font-weight: 650; }
    ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
    li { display: flex; flex-direction: column; align-items: start; padding: 1.25rem; border: 1px solid var(--cp-border); border-top: 4px solid var(--cp-accent); border-radius: 16px; background: var(--cp-surface); }
    li button { margin-top: auto; }
    .tag, .notice { padding: .25rem .625rem; border-radius: .625rem; color: var(--cp-accent); background: var(--cp-accent-soft); font-weight: 650; }
    .tag { margin: 0 0 .75rem; font-size: .875rem; overflow-wrap: anywhere; }
    li h2, li p { overflow-wrap: anywhere; max-width: 100%; }
    nav, .actions { display: flex; gap: .75rem; }
    button, input, textarea { border: 1px solid var(--cp-border-strong); border-radius: .625rem; padding: .5rem .875rem; color: var(--cp-text); background: var(--cp-surface); font: inherit; }
    button { cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--cp-accent); }
    button:disabled { opacity: .65; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 2px; }
    .primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); font-weight: 650; }
    .primary:hover:not(:disabled) { background: var(--cp-accent-hover); }
    form { margin-bottom: 1.5rem; padding: 1.25rem; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
    fieldset { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: .75rem; margin: 1rem 0; padding: 0; border: 0; min-width: 0; }
    label { display: grid; gap: .25rem; font-weight: 650; min-width: 0; }
    label.wide { grid-column: 1 / -1; }
    input, textarea { min-width: 0; }
    textarea { resize: vertical; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
